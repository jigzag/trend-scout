# ===== 話題検知 Ver.0 設定 =====

# サイトのジャンル（AIの採点基準になる。ここを書き換えればジャンル変更できる）
genre: |
  【読者】コードを書かない個人（会社員・個人事業主・副業の人）。動画・資料・SNS発信・文章作りなどの
  制作や事務作業を、AIで楽にしたい。プログラミングの知識も、会社の業務システムも前提にしない。
  【方針】海外で出たばかりのAIツール・新機能を、日本語の情報がまだ少ないうちに紹介し、
  「日本の読者ならどう使えるか」を具体的に示す（2026-10-26〜）。
  【扱う】ブラウザやアプリで使える、海外の新しいAIツール・SaaS・既存ツールの新機能。
  例: AI動画生成(Runway, Kling, Hailuo/MiniMax, Sora, Veo)、AI音声・ナレーション(ElevenLabs等)、
  スライド・資料作成(Gamma等)、ChatGPT/Claude/Geminiの新機能、ノーコード自動化(Zapier, Make)、
  Canva・CapCut・Premiereなど制作ツールのAI機能、文字起こし・議事録、AIを使った業務効率化。
  アカウントを作れば、今日から一人で使い始められるものを優先する。
  日本のサービスや日本語の記事でも、上の条件に合えば扱ってよい。
  【対象外（関連度は0〜2にする）】コードを書く前提の話（SDK・API実装・CLI・ライブラリ・
  プログラミング言語・開発環境・エディタ拡張・エージェント開発フレームワーク）、
  Claude Code・Codex・Cursor などのコーディング用AIと、そのスキル・MOD・MCP・設定の話
  （動画や資料を作る話でも、コーディング用AIで作るなら対象外）、GitHubのリポジトリやREADME、
  AIエージェントの権限・安全対策など開発者向けの話、
  インフラ・セキュリティ・クラウド運用、研究論文、資金調達や人事などの業界ニュースのみの話、
  特定の業務システム（HubSpot・Salesforce・会計ソフト・社内データ基盤など）を使っている前提のツール、
  マーケター・経理・営業管理・採用など専門職向けの分析/管理ツール、会社単位の導入や商談が前提の法人向けサービス
  （2026-10-29 追加。例: HubSpotの収益データとつなぐマーケティング分析SaaS）。
  発表まとめ・イベントレポート・ニュースのまとめ記事など、特定のツールや機能の話でないものは、
  使い道を3以下にする（例: 「DevDay発表まとめ」）。

# 採点の重み（合計1.0）
weights:
  relevance: 0.30    # ジャンルとの関連度
  usecase: 0.25      # 非エンジニアの仕事での使い道を、具体的に想像しやすいか
  novelty: 0.20      # 日本語の情報がまだ少ないか（海外で出たばかり＝高い）
  monetizable: 0.10  # 紹介できる有料ツール・商品・アフィリエイト案件がありそうか
  buzz: 0.15         # 話題度（各ソース内の順位から自動計算。AIは使わない）

min_relevance: 5   # 関連度がこれ未満は候補から除外（0-10）
top_n: 3           # 毎朝通知する件数
recheck_days: 14   # 一度出したURLを再度候補にしない日数

# 各ソースから取得する最大件数
sources:
  hatena:      { enabled: true, limit: 30 }   # はてブ テクノロジー人気
  zenn:        { enabled: true, limit: 20 }   # Zenn デイリートレンド
  qiita:       { enabled: true, limit: 20 }   # Qiita 人気記事
  hackernews:  { enabled: false, limit: 30 }  # Hacker News フロントページ（2026-10-25 停止: 3週間で採用1件、英語の開発者向けが中心）
  # 海外の新しいAIツール・ニュース（2026-10-26〜 海外中心の方針で主力）
  producthunt: { enabled: true, limit: 20, label: "ProductHunt", url: "https://www.producthunt.com/feed?category=artificial-intelligence" }
  techcrunch:  { enabled: true, limit: 20, label: "TechCrunch", url: "https://techcrunch.com/category/artificial-intelligence/feed/" }
  theverge:    { enabled: true, limit: 10, label: "The Verge", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml" }
  # 非エンジニア向けのAIニュース（任意のRSS/Atomを url で追加できる）
  itmedia_ai:  { enabled: true, limit: 20, label: "ITmedia AI+", url: "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml" }

# ===== セール検知（毎朝の候補3件とは別枠で、最大3行を通知の末尾に付ける） =====
sale_watch:
  enabled: true
  max_items: 3
  # 読者に関係あるセールの範囲（AIの判定基準）
  focus: |
    AI・制作系のツール/SaaS（Adobe, Canva, ElevenLabs, Runway, Kling, Gamma, Notion, ChatGPT等）の
    割引・無料期間延長・キャンペーン。動画/配信/資料制作に使う機材（マイク、Webカメラ、照明、
    SSD、PC、モニター、オーディオインターフェース）のセール。
    Amazonの大型セール（プライム感謝祭、ブラックフライデー、初売り、新生活、プライムデー等）の
    日程発表・開始・先行セール情報。
    食品・ファッション・日用品だけのセール、ゲームの値引き、クーポン配布だけの話は対象外。
  # まずこの語を含むものだけAIに渡す（費用節約のための一次ふるい）
  keywords: [セール, 割引, 値下げ, 半額, "%OFF", "% off", オフ, キャンペーン, 無料期間, 特価, 期間限定,
             プライム感謝祭, プライムデー, ブラックフライデー, サイバーマンデー, 初売り, タイムセール,
             sale, discount, deal, "black friday", "cyber monday", "prime day", lifetime, coupon]
  # セール情報が多いサイト（取得失敗しても他は続行）
  sources:
    gorime:  { enabled: true, limit: 30, label: "gori.me", url: "https://gori.me/feed" }
    prtimes: { enabled: true, limit: 50, label: "PR TIMES", url: "https://prtimes.jp/index.rdf" }

# ===== 記事生成（Ver.1: python article.py --n 候補番号） =====
article:
  max_sources: 3       # 参考記事の最大数（候補の元記事 + 別サイトの関連記事）
  max_chars: 6000      # 参考記事1件あたり、AIに渡す最大文字数
  max_results: 8       # Tavily 検索で取る件数（この中から別サイトのものを選ぶ）
  time_range: month    # 関連記事を探す期間（day / week / month / year）
  country: ""          # 検索で優先する国（空＝指定なし。海外ツールは英語の記事を探す）
  # 関連記事として使わないもの（一覧ページ・まとめ・SNS。候補の元記事には適用しない）
  exclude_domains: [b.hatena.ne.jp, news.google.com, x.com, twitter.com, youtube.com, facebook.com,
                    instagram.com, tiktok.com, togetter.com, posfie.com]
  exclude_title_words: [新着エントリー, 人気エントリー, ニュースまとめ, まとめサイト, ランキング]
  min_chars: 3000      # 本文の目安（下限）
  max_chars_body: 4000 # 本文の目安（上限）
  # 類似度チェック（参考記事と12文字以上の一致が続く長さ・割合）
  max_run: 40          # 連続一致がこの文字数以上の段落は書き直す
  max_ratio: 0.08      # 記事全体の一致率の上限
  rewrite_rounds: 2
  # 記事用のAI設定（llm の値を上書き。空なら llm と同じ）
  llm:
    openai_reasoning_effort: medium

# WordPress のカテゴリ（記事ごとにAIがこの中から1つ選ぶ。なければ自動で作る）
categories: [動画生成, 画像生成・デザイン, 音声・ナレーション, 文字起こし・議事録, 資料・スライド作成,
             文章作成・チャットAI, 業務効率化・自動化, SNS・マーケティング, その他のAIツール]

# ===== 記事の画像（OpenAI の画像生成。WordPress 投稿時だけ作る） =====
image:
  enabled: true
  model: gpt-image-2   # OpenAI の画像モデル（使えない場合はエラー内容が LINE の警告に出る）
  quality: low         # low / medium / high（low で1枚数円〜十数円）
  size: 1536x1024      # 横長（アイキャッチ向き）
  body_image: true     # 想定シナリオの見出しの下にも1枚入れる
  page_shot: true      # 公式サイト（ダウンロードページ）の画面を自動で撮って手順に入れる（Actions で Playwright を入れたときだけ）

# AI設定（provider: anthropic か openai。APIキーは環境変数で渡す）
llm:
  provider: openai
  anthropic_model: claude-sonnet-4-5
  openai_model: gpt-5-mini
