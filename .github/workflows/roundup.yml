name: weekly-roundup

on:
  schedule:
    - cron: "0 23 * * 6"   # UTC 土曜23:00 = 日本時間 日曜8:00（毎朝7時の候補の後）
  workflow_dispatch:

permissions:
  contents: write           # data/roundups/ をコミットするため

concurrency:
  group: write-article      # 記事生成と同時に動かさない
  cancel-in-progress: false

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write roundup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python roundup.py
      - name: Save
        if: always()
        run: |
          git config user.name "trend-scout-bot"
          git config user.email "trend-scout-bot@users.noreply.github.com"
          git add data/roundups/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "roundup: $(date -u +%F)"
          git pull --rebase && git push
